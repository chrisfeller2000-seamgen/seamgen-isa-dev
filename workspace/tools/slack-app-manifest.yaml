display_information:
  name: Seamgen RFP Assistant
  description: Sends RFP materials requests and status updates to the Seamgen team.
  background_color: "#2c3e50"
features:
  bot_user:
    display_name: Seamgen RFP Assistant
    always_online: false
oauth_config:
  scopes:
    bot:
      # Post messages to channels and DMs.
      - chat:write
      # Post to public channels the bot has not been invited to.
      - chat:write.public
      # Open a direct-message conversation with a person.
      - im:write
      # Look people up so we can DM them by name.
      - users:read
      # Look people up by their email address.
      - users:read.email
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
